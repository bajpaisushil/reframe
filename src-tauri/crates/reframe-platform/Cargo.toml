[package]
name = "reframe-platform"
description = "Platform abstraction layer for Reframe: windows, monitors, processes, launching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# In-memory test double used by reframe-core's tests. Never enabled in the app.
mock = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
ts-rs.workspace = true
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
which = "8"
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["randr", "res"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Default features are disabled on the framework crates (their defaults enable every binding in
# the framework); only the bindings the macOS implementation uses are listed.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSArray",
  "NSBundle",
  "NSData",
  "NSDictionary",
  "NSEnumerator",
  "NSGeometry",
  "NSProcessInfo",
  "NSString",
  "NSURL",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "objc2-core-foundation",
  "NSBitmapImageRep",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSRunningApplication",
  "NSScreen",
  "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFBase",
  "CFCGTypes",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFUUID",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "CGDirectDisplay",
  "CGDisplayConfiguration",
  "CGError",
  "CGWindow",
] }
# HIServices Accessibility (AX) API.
objc2-application-services = { version = "0.3", default-features = false, features = [
  "std",
  "HIServices",
  "AXError",
  "AXUIElement",
  "AXValue",
] }
# Main-queue dispatch for the main-thread-only NSScreen API.
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"

[dev-dependencies]
