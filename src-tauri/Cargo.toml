[workspace]
members = ["crates/reframe-core", "crates/reframe-platform"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
reframe-core = { path = "crates/reframe-core" }
reframe-platform = { path = "crates/reframe-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
ts-rs = { version = "12", features = ["serde-json-impl", "chrono-impl", "uuid-impl", "no-serde-warnings"] }

# ---------------------------------------------------------------------------
# Tauri desktop application (thin command layer over reframe-core)
# ---------------------------------------------------------------------------
[package]
name = "reframe"
description = "Reframe — your workspace, exactly where you left it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "reframe_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reframe-core.workspace = true
reframe-platform.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
log.workspace = true
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[profile.dev]
# Keep debug builds quick and the target directory small.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
